<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>File — Mystery For Joy</title>
  <link rel="stylesheet" href="file-viewer.css">
  <link rel="stylesheet" href="site-footer.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://mysteryforjoy.fr">
      <img class="brand-mark" src="https://signabroam.ovh/assets/icons/logo/signabroam%20no%20background.png" alt="">
      Mystery For Joy
    </a>
    <a class="top-link" href="https://github.com/Keyfront/Mystery-For-Joy-data_asset_directory">Repository</a>
    <span class="top-spacer"></span>
    <span class="top-note">API of <a href="https://mysteryforjoy.fr">mysteryforjoy.fr</a></span>
  </header>
  <main>
    <h1 class="repo-title"><a href="https://github.com/Keyfront">Keyfront</a> / <a href="./">Mystery-For-Joy-data_asset_directory</a></h1>
    <nav class="breadcrumb" aria-label="File path" data-file-breadcrumb>
      <a href="./">root</a>
    </nav>
    <section class="file-panel" aria-label="File source">
      <div class="file-toolbar">
        <div class="file-meta">
          <strong data-file-name>Loading file...</strong>
          <span data-file-stats></span>
        </div>
        <div class="file-actions">
          <a class="button" data-github-link target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="button" data-raw-link target="_blank" rel="noopener noreferrer">Raw</a>
          <a class="button" data-download-link download>Download</a>
        </div>
      </div>
      <p class="file-status" data-file-status role="status">Loading source code...</p>
      <div class="code-wrap" data-code-wrap hidden>
        <table class="code-table" aria-label="Source code">
          <tbody data-code-lines></tbody>
        </table>
      </div>
    </section>
    <footer class="site-footer">
      <p class="footer-back"><a href="./">Back to repository root</a></p>
      <div class="footer-main">
        <div class="footer-links">
          <a class="footer-link" href="https://github.com/Keyfront/Mystery-For-Joy-data_asset_directory">GitHub repository</a>
          <a class="footer-link" href="https://signabroam.ovh">Service mark: signabroam.ovh</a>
        </div>
      </div>
      <p class="footer-note">Schedule asset API for <a href="https://mysteryforjoy.fr">mysteryforjoy.fr</a>.</p>
    </footer>
  </main>
  <script src="file-viewer.js"></script>
</body>
</html>
